<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiththi</title>
<meta name="description" content="A polite, consent-first way to connect with people nearby.">
<style>
 body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f3ff;color:#1c1b1f;line-height:1.6}
 main{max-width:560px;padding:32px;text-align:center}
 h1{font-size:2.6rem;margin:0 0 8px;color:#5b3fd9}
 p.tag{font-size:1.15rem;margin:0 0 28px}
 .soon{display:inline-block;padding:8px 18px;border-radius:999px;background:#5b3fd9;color:#fff;font-weight:600;margin-bottom:32px}
 nav a{margin:0 10px;color:#5b3fd9;text-decoration:none}
 footer{margin-top:36px;font-size:.9rem;opacity:.8}
 @media (prefers-color-scheme: dark){body{background:#17141f;color:#e6e1e5} h1,nav a{color:#bfb0ff} .soon{background:#7c64f0}}
</style></head>
<body><main>
<h1>{{APP}}</h1>
<p class="tag">A polite, consent-first way to connect with people nearby.</p>
<div class="soon">Coming soon to Google Play</div>
<nav>
 <a href="privacy.html">Privacy Policy</a>
 <a href="terms.html">Terms of Use</a>
 <a href="delete-account.html">Delete your account</a>
</nav>
<footer>&copy; {{OWNER}}<br>Contact: <a href="mailto:{{EMAIL}}">{{EMAIL}}</a></footer>
</main>
<script src="config.js"></script>
<script>
 (function(){var L=window.LEGAL||{};var h=document.body.innerHTML;
  h=h.split('{{OWNER}}').join(L.owner||'')
     .split('{{EMAIL}}').join(L.email||'')
     .split('{{APP}}').join(L.app||'Chiththi');
  document.body.innerHTML=h;})();
</script>
</body></html>
